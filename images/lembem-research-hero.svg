<title id="title">LEMBEM LAB — emerging media, bioinformatics and engineering models</title>
<desc id="desc">Cool-blue scientific research landscape with a luminous globe, DNA helix, computational networks, topographic data and research facility, leaving open negative space for headline on the left.</desc>
<defs>
  <linearGradient id="sky" x1="0" x2="1" y1=".1" y2=".9"><stop stop-color="#E9F8FF"/><stop offset=".42" stop-color="#BDE4F4"/><stop offset=".76" stop-color="#4C9CB9"/><stop offset="1" stop-color="#123F65"/></linearGradient>
  <linearGradient id="ocean" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#73C5DA"/><stop offset=".55" stop-color="#227A9D"/><stop offset="1" stop-color="#0A3655"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#A6F3FF" stop-opacity=".65"/><stop offset=".6" stop-color="#50BDD8" stop-opacity=".18"/><stop offset="1" stop-color="#0E4166" stop-opacity="0"/></radialGradient>
  <linearGradient id="plate" x1="0" x2="1"><stop stop-color="#0E4364" stop-opacity=".06"/><stop offset=".75" stop-color="#032E4D" stop-opacity=".64"/><stop offset="1" stop-color="#061D37" stop-opacity=".9"/></linearGradient>
  <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#E8FCFF" stop-opacity=".63"/><stop offset=".7" stop-color="#3DA7C5" stop-opacity=".2"/><stop offset="1" stop-color="#0D5076" stop-opacity=".6"/></linearGradient>
  <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse"><path d="M62 0H0V62" fill="none" stroke="#2C9BC2" stroke-width="1" opacity=".15"/></pattern>
  <pattern id="smallgrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#A5F0FF" stroke-width=".55" opacity=".15"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="globeclip"><circle cx="1470" cy="360" r="277"/></clipPath>
  <g id="node"><circle r="6" fill="#D9FAFF"/><circle r="15" fill="#7BDDFA" opacity=".18"/></g>
</defs>
